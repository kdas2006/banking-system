<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleBank — Transfer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ---- NAVBAR ---- -->
  <nav class="navbar">
    <h1>🏦 SimpleBank</h1>
    <div class="navbar-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="transfer.html">Transfer</a>
      <a href="history.html">History</a>
    </div>
    <div class="navbar-user">
      <span>Hello, <strong id="user-name"></strong></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- ---- PAGE CONTENT ---- -->
  <div class="container">

    <div class="page-header">
      <h2>Transfer Money</h2>
      <p>Send money instantly to any SimpleBank account</p>
    </div>

    <!-- Transfer Form -->
    <div class="card" style="max-width: 500px;">
      <h3>🔄 Send Money</h3>

      <div class="form-group">
        <label>Recipient Username</label>
        <input type="text" id="to-username" placeholder="Enter their username">
      </div>

      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="transfer-amount" placeholder="Enter amount" min="1">
      </div>

      <button class="btn btn-primary" onclick="transfer()">Transfer Now</button>

      <p id="transfer-message" class="message"></p>
    </div>

    <!-- Current Balance -->
    <div class="card" style="max-width: 500px;">
      <h3>💼 Your Balance</h3>
      <p class="balance-display" id="balance">Loading...</p>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    loadTransferPage(); // Setup the page
  </script>

</body>
</html>
